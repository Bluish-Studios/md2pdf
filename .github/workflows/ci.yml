name: CI

# The merge gates. `gates` runs scripts/check.ps1 (the same script as the local git hooks); `security` runs
# pinned scanners. Each prints a pass/fail table in the run summary. The PR-description gate lives in
# pr-body.yml, because it must re-run when the description is edited without re-running everything here.
#
# Kept cheap on purpose: Windows minutes bill at 2x and every job rounds up to a whole minute, so everything
# that needs Windows runs in ONE job, and only on pull requests (a merge commit has the tree its PR already
# passed). Run it by hand on any branch with "Run workflow" (workflow_dispatch).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (lint, privacy, tests with Edge, coverage)
    runs-on: windows-latest # Microsoft Edge is preinstalled; md2pdf needs Python 3.13+
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the privacy gate checks every commit's author and message
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Every gate (same as the pre-push hook)
        run: ./scripts/check.ps1 -Mode full -NoVenv
      - name: Upload PDFs, page images and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: test-artifacts/
          retention-days: 14
          if-no-files-found: warn

  security:
    name: Security (secrets, vulnerable dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not just the tip
      # A pinned release binary with its checksum verified, not a third-party action.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/$tarball" -o "/tmp/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/checksums.txt
          (cd /tmp && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$tarball" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Secret scan (full history)
        run: gitleaks git --redact --verbose --log-opts="--all" .
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Audits the versions md2pdf's first run would install today (the newest within each range).
      - name: Known vulnerabilities in dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --strict --progress-spinner off -r requirements-dev.txt
