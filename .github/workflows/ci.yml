name: CI

# The merge gates. Each job runs scripts/check.ps1 (the same script as the local git hooks) or a pinned
# scanner, and prints a pass/fail table in the run summary. The PR-description gate lives in pr-body.yml,
# because it must re-run when the description is edited without re-running everything here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, privacy, workflow YAML
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the privacy gate checks every commit's author and message
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Gates
        run: ./scripts/check.ps1 -Mode lint -NoVenv

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest # Microsoft Edge is preinstalled
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"] # the oldest supported and the current release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Unit, end-to-end and launcher tests with the coverage floor
        run: ./scripts/check.ps1 -Mode test -NoVenv
      - name: Upload PDFs, page images and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-py${{ matrix.python }}
          path: test-artifacts/
          retention-days: 14
          if-no-files-found: warn

  security:
    name: Security (secrets, vulnerable dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not just the tip
      # A pinned release binary with its checksum verified, not a third-party action.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/$tarball" -o "/tmp/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/checksums.txt
          (cd /tmp && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$tarball" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Secret scan (full history)
        run: gitleaks git --redact --verbose --log-opts="--all" .
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Audits the versions md2pdf's first run would install today (the newest within each range).
      - name: Known vulnerabilities in dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --strict --progress-spinner off -r requirements-dev.txt
