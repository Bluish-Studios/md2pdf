name: PR body

# Checks the PR DESCRIPTION against .github/pull_request_template.md. Kept out of ci.yml on purpose:
# it must re-run on `edited`, and an edit must never re-run (or skip) the real gates.
# Fix a failure by editing the description in the browser; the check re-runs by itself.
# "Re-run jobs" does NOT work: GitHub replays the original event, with the old description.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  pr-body:
    name: PR description follows the template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to see whether the PR changes a dependency
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The body goes through an environment variable, never straight into the script, so it cannot inject commands.
      - name: Check the description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python scripts/gates.py pr-body --body-file "$RUNNER_TEMP/pr-body.md" --base "$BASE_SHA"
